<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTSB Direct — Unfiltered Aviation Safety Database</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--text-main);
            font-weight: 400;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .report-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
        }

        .report-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .report-item:hover {
            background-color: #334155;
        }

        .report-item.active {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: 600;
        }

        .content-area {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0f172a;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 1rem;
            gap: 10px;
        }

        .status {
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            NTSB <span>// UNFILTERED ARCHIVE</span>
        </div>
    </header>

    <div class="main-container">
        <sidebar>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search investigation..." oninput="filterReports()">
            </div>
            <ul class="report-list" id="reportList">
                <div class="status" id="statusMsg">Loading database...</div>
            </ul>
        </sidebar>

        <main class="content-area">
            <div id="placeholder" class="placeholder">
                <p>Select an investigation report from the list on the left.</p>
            </div>
            <iframe id="reportFrame" style="display: none;"></iframe>
        </main>
    </div>

    <script>
        const REPO_OWNER = 'SSD-unix';
        const REPO_NAME = 'SSDunix.xyz';
        const PATH = 'ntsb/all';

        // GitHub REST API endpoint
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PATH}`;
        // Base raw URL for fetching HTML source
        const RAW_BASE_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${PATH}/`;

        let allReports = [];

        async function fetchReports() {
            const statusMsg = document.getElementById('statusMsg');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`GitHub API HTTP ${response.status}`);
                }
                
                const files = await response.json();
                
                // Filter only .html files
                allReports = files
                    .filter(file => file.name.toLowerCase().endsWith('.html'))
                    .map(file => ({
                        name: file.name,
                        title: file.name.replace(/\.html$/i, '').replaceAll('_', ' '),
                        rawUrl: RAW_BASE_URL + file.name
                    }));

                if (allReports.length === 0) {
                    statusMsg.innerText = 'No reports found.';
                    return;
                }

                renderList(allReports);
            } catch (err) {
                console.error(err);
                statusMsg.innerText = 'Failed to load report directory.';
            }
        }

        function renderList(reports) {
            const listEl = document.getElementById('reportList');
            listEl.innerHTML = '';

            if (reports.length === 0) {
                listEl.innerHTML = '<div class="status">No matching reports.</div>';
                return;
            }

            reports.forEach(report => {
                const li = document.createElement('li');
                li.className = 'report-item';
                li.innerText = report.title;
                li.onclick = () => loadReport(report, li);
                listEl.appendChild(li);
            });
        }

        function filterReports() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allReports.filter(r => r.title.toLowerCase().includes(query));
            renderList(filtered);
        }

        async function loadReport(report, element) {
            document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const placeholder = document.getElementById('placeholder');
            const iframe = document.getElementById('reportFrame');

            placeholder.style.display = 'none';
            iframe.style.display = 'block';

            try {
                // Fetch full raw HTML text to bypass X-Frame-Options blocking
                const res = await fetch(report.rawUrl);
                if (!res.ok) {
                    throw new Error(`Failed to fetch file (HTTP ${res.status})`);
                }

                let htmlContent = await res.text();
                
                // Inject <base> tag so relative links and images render correctly
                const baseTag = `<base href="${report.rawUrl}">`;
                if (htmlContent.includes('<head>')) {
                    htmlContent = htmlContent.replace('<head>', `<head>${baseTag}`);
                } else {
                    htmlContent = baseTag + htmlContent;
                }

                // Inject into iframe safely
                iframe.srcdoc = htmlContent;

            } catch (err) {
                console.error(err);
                iframe.srcdoc = `
                    <body style="background:#0f172a; color:#f8fafc; font-family:sans-serif; padding:2rem;">
                        <h2 style="color:#ef4444;">Error Loading Report</h2>
                        <p style="margin-top:0.5rem; color:#94a3b8;">${err.message}</p>
                    </body>
                `;
            }
        }

        // Initialize scanning on load
        fetchReports();
    </script>
</body>
</html>
