<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
</head>
<body>
    <p id="status">Перенаправление...</p>

    <script>
        const configUrl = 'https://ssdunix.xyz/download/hb.server';

        // Запрашиваем содержимое файла
        fetch(configUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка сети при получении ссылки');
                }
                return response.text(); // Получаем текст из файла
            })
            .then(redirectUrl => {
                // Очищаем пробелы и переносы строк, если они есть в файле
                const cleanUrl = redirectUrl.trim(); 
                
                // Проверяем, что внутри файла действительно ссылка
                if (cleanUrl.startsWith('http://') || cleanUrl.startsWith('https://')) {
                    window.location.href = cleanUrl; // Перенаправляем
                } else {
                    document.getElementById('status').innerText = 'Ошибка: Некорректный адрес перенаправления.';
                }
            })
            .catch(error => {
                console.error('Ошибка:', error);
                document.getElementById('status').innerText = 'Не удалось получить адрес для перенаправления.';
            });
    </script>
</body>
</html>
