<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CyberOS SuperApp</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.75);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.3);
      --text: #ffffff;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    /* Фоновый неоновый градиент */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--cyan-glow) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -150px;
      z-index: 0;
      pointer-events: none;
    }

    #os-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 1;
    }

    /* Верхний статус-бар */
    .status-bar {
      height: 40px;
      background: rgba(10, 12, 18, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .time-badge {
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--cyan);
    }

    .status-indicators {
      display: flex;
      gap: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: var(--subtext);
      border: 1px solid var(--border);
    }

    .badge.active {
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Рабочий стол */
    .desktop {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Виджет часов */
    .clock-widget {
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 25px 40px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .clock-widget .time {
      font-size: 4rem;
      font-weight: 200;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .clock-widget .date {
      font-size: 0.9rem;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }

    /* Быстрый контроллер плеера на рабочем столе */
    .quick-player {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px 15px;
      border-radius: 50px;
      border: 1px solid var(--border);
      backdrop-filter: blur(15px);
    }

    .qp-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .qp-btn:active {
      transform: scale(0.85);
      background: var(--accent);
    }

    /* Окно активных приложений */
    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 10;
    }

    .app-window.active {
      display: flex;
    }

    .window-header {
      height: 50px;
      background: rgba(15, 17, 23, 0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .window-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .window-content {
      flex: 1;
      width: 100%;
      height: calc(100% - 50px);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Поле ввода для замен URL / ID */
    .custom-input-bar {
      display: flex;
      padding: 10px;
      gap: 10px;
      background: #111319;
      border-bottom: 1px solid var(--border);
    }

    .custom-input-bar input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }

    .custom-input-bar button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* Заметки */
    textarea.notes-area {
      width: 100%;
      height: 100%;
      background: #0d0e12;
      color: #fff;
      border: none;
      padding: 20px;
      font-size: 16px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    /* Док-панель */
    .dock-container {
      padding: 0 15px 15px 15px;
      display: flex;
      justify-content: center;
    }

    .dock {
      height: 65px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dock-icon:active {
      transform: scale(0.85);
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Оверлей старта */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .start-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(45deg, var(--accent), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-subtitle {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .start-btn {
      background: linear-gradient(45deg, var(--accent), #d9004c);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px var(--accent-glow);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <!-- Стартовый оверлей -->
  <div id="start-overlay">
    <div class="start-title">CyberOS</div>
    <div class="start-subtitle">Автономный Музыкальный Терминал</div>
    <button class="start-btn" onclick="bootOS()">ЗАПУСТИТЬ СИСТЕМУ</button>
  </div>

  <div id="os-root">
    <!-- Верхний бар -->
    <div class="status-bar">
      <div class="time-badge" id="os-clock">00:00</div>
      <div class="status-indicators">
        <span id="wakelock-status" class="badge">WAKE LOCK: OFF</span>
        <span id="fs-status" class="badge">FULLSCREEN</span>
      </div>
    </div>

    <!-- Рабочий стол -->
    <div class="desktop">
      <div class="clock-widget">
        <div class="time" id="widget-time">00:00</div>
        <div class="date" id="widget-date">Понедельник, 1 января</div>
      </div>

      <!-- Быстрое радио -->
      <div class="quick-player">
        <button class="qp-btn" onclick="openApp('Lofi Girl', 'lofi')" title="Включить Lofi Radio">📻</button>
        <button class="qp-btn" onclick="openApp('Synthwave Radio', 'synth')" title="Включить Synthwave">🌃</button>
        <button class="qp-btn" onclick="openApp('Заметки', 'notes')" title="Заметки">📝</button>
      </div>

      <!-- Окно приложения -->
      <div id="app-window" class="app-window">
        <div class="window-header">
          <span class="window-title" id="window-title">Приложение</span>
          <button class="close-btn" onclick="closeApp()">✕</button>
        </div>
        <div id="custom-bar" class="custom-input-bar" style="display:none;">
          <input type="text" id="yt-id-input" placeholder="Вставь ID видео или плейлиста YouTube...">
          <button onclick="loadCustomYT()">Загрузить</button>
        </div>
        <div class="window-content" id="window-content"></div>
      </div>
    </div>

    <!-- Док-панель -->
    <div class="dock-container">
      <div class="dock">
        <div class="dock-icon" title="Lofi Radio" onclick="openApp('Lofi Girl 24/7', 'lofi')">☕</div>
        <div class="dock-icon" title="Synthwave" onclick="openApp('Synthwave Radio', 'synth')">🌆</div>
        <div class="dock-icon" title="Кастомный Плейлист" onclick="openApp('YouTube Player', 'yt_custom')">▶️</div>
        <div class="dock-icon" title="Заметки" onclick="openApp('Блокнот', 'notes')">📝</div>
        <div class="dock-icon" title="Свернуть всё" onclick="closeApp()">🏠</div>
      </div>
    </div>
  </div>

  <script>
    let wakeLock = null;

    // Часы
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      document.getElementById('os-clock').innerText = timeStr;
      document.getElementById('widget-time').innerText = timeStr;

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('widget-date').innerText = now.toLocaleDateString('ru-RU', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Фиксация экрана от отключения (Wake Lock)
    async function enableWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          const badge = document.getElementById('wakelock-status');
          badge.innerText = 'WAKE LOCK: ON';
          badge.classList.add('active');
        }
      } catch (err) {
        console.error('WakeLock Error:', err);
      }
    }

    // Запуск ОС
    function bootOS() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen();
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }

      enableWakeLock();
      document.getElementById('start-overlay').style.display = 'none';
    }

    // Загрузка приложений
    function openApp(name, type) {
      const win = document.getElementById('app-window');
      const title = document.getElementById('window-title');
      const content = document.getElementById('window-content');
      const customBar = document.getElementById('custom-bar');

      title.innerText = name;
      content.innerHTML = '';
      customBar.style.display = 'none';

      if (type === 'lofi') {
        // Гарантированно рабочий прямой Embed Lofi Girl 
        content.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } 
      else if (type === 'synth') {
        // Гарантированно рабочий Embed Synthwave Radio
        content.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/4xDzrJKXOOY?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } 
      else if (type === 'yt_custom') {
        customBar.style.display = 'flex';
        // По умолчанию грузит классический Lofi плейлист
        content.innerHTML = `<iframe id="custom-iframe" src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } 
      else if (type === 'notes') {
        content.innerHTML = `<textarea class="notes-area" placeholder="Ваши заметки сохраняются автоматически..." id="notes-input" oninput="localStorage.setItem('cyberos_notes', this.value)"></textarea>`;
        setTimeout(() => {
          document.getElementById('notes-input').value = localStorage.getItem('cyberos_notes') || '';
        }, 50);
      }

      win.classList.add('active');
    }

    // Загрузка любого своего ID видео/плейлиста
    function loadCustomYT() {
      const input = document.getElementById('yt-id-input').value.trim();
      const iframe = document.getElementById('custom-iframe');
      if (!input || !iframe) return;

      if (input.includes('list=')) {
        const listId = input.split('list=')[1].split('&')[0];
        iframe.src = `https://www.youtube-nocookie.com/embed/videoseries?list=${listId}&autoplay=1`;
      } else if (input.includes('v=')) {
        const videoId = input.split('v=')[1].split('&')[0];
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
      } else {
        iframe.src = `https://www.youtube-nocookie.com/embed/${input}?autoplay=1`;
      }
    }

    function closeApp() {
      const win = document.getElementById('app-window');
      const content = document.getElementById('window-content');
      win.classList.remove('active');
      content.innerHTML = '';
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await enableWakeLock();
      }
    });
  </script>
</body>
</html>
