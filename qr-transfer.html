<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EDEDED" />
<title>QR Chat</title>
<style>
  :root {
    --green: #07C160;
    --green-dark: #06AD56;
    --bg: #EDEDED;
    --bubble-me: #95EC69;
    --bubble-them: #FFFFFF;
    --text: #111;
    --muted: #888;
    --header: #F5F5F5;
    --border: rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 16px;
    overscroll-behavior: none;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100dvh; height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- Шапка ---------- */
  .topbar {
    height: 52px; flex-shrink: 0;
    background: var(--header);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px;
    padding: 0 8px;
    backdrop-filter: saturate(180%) blur(20px);
  }
  .topbar .title-block { flex: 1; text-align: center; }
  .topbar .title { font-size: 16px; font-weight: 600; line-height: 1.1; }
  .topbar .subtitle {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ccc; flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 6px rgba(7,193,96,0.6); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: transparent;
    font-size: 20px; color: #333;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .icon-btn:active { background: rgba(0,0,0,0.06); }

  /* ---------- Чат ---------- */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 12px 12px 4px;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth;
  }
  .chat:empty::before {
    content: 'Чат пуст. Напиши первое сообщение.';
    display: block; text-align: center; color: var(--muted);
    font-size: 13px; margin-top: 24px;
  }
  .day {
    text-align: center; font-size: 11px; color: var(--muted);
    margin: 8px 0;
  }
  .msg-row {
    display: flex; width: 100%;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.them { justify-content: flex-start; }

  .bubble {
    max-width: 76%;
    padding: 9px 12px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.35;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  }
  .msg-row.me .bubble {
    background: var(--bubble-me);
    color: #000;
    border-bottom-right-radius: 6px;
  }
  .msg-row.them .bubble {
    background: var(--bubble-them);
    color: #000;
    border-bottom-left-radius: 6px;
  }
  .bubble.img {
    padding: 4px; background: #fff;
    border-radius: 14px;
    max-width: 70%;
  }
  .bubble.img img {
    display: block; width: 100%; max-width: 260px;
    border-radius: 10px;
    cursor: pointer;
  }
  .bubble .caption {
    font-size: 14px; padding: 6px 6px 2px;
  }

  /* ---------- Composer ---------- */
  .composer {
    flex-shrink: 0;
    background: var(--header);
    border-top: 1px solid var(--border);
    padding: 8px 8px;
    display: flex; align-items: flex-end; gap: 6px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .composer textarea {
    flex: 1;
    min-height: 40px; max-height: 120px;
    padding: 10px 14px;
    font-size: 16px;
    font-family: inherit;
    border: none; border-radius: 20px;
    background: #fff;
    resize: none;
    outline: none;
    line-height: 20px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.04);
  }
  .send-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.1s, opacity 0.2s;
    box-shadow: 0 2px 6px rgba(7,193,96,0.35);
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: #C8C8C8; box-shadow: none; }
  .send-btn svg { width: 20px; height: 20px; }

  /* ---------- Setup overlay ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #f8f9fa 0%, #eaeef1 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
    transition: opacity 0.3s, visibility 0.3s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .setup-card {
    width: 100%; max-width: 380px;
    background: #fff;
    border-radius: 20px;
    padding: 24px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
    text-align: center;
  }
  .setup-card h2 {
    margin: 0 0 4px; font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--green), #06AD56);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .setup-card .hint {
    color: var(--muted); font-size: 13px; margin: 0 0 20px;
  }
  .btn {
    width: 100%; padding: 14px;
    border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    font-family: inherit;
    margin-bottom: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary {
    background: var(--green); color: #fff;
    box-shadow: 0 4px 12px rgba(7,193,96,0.3);
  }
  .btn.secondary {
    background: #F1F3F4; color: #222;
  }
  .divider {
    color: var(--muted); font-size: 12px;
    margin: 12px 0 10px; position: relative;
  }
  .divider::before, .divider::after {
    content: ''; position: absolute; top: 50%;
    width: 38%; height: 1px; background: #E0E0E0;
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }
  .row { display: flex; gap: 6px; }
  .row input {
    flex: 1; padding: 12px 14px;
    border-radius: 12px; border: 1px solid #E0E0E0;
    font-size: 15px; font-family: inherit;
    background: #FAFAFA; outline: none;
  }
  .row input:focus { border-color: var(--green); background: #fff; }
  .row .btn { width: auto; margin: 0; padding: 12px 20px; }
  #qrBox {
    margin: 16px auto 8px;
    display: none;
    justify-content: center;
    animation: pop 0.3s ease-out;
  }
  #qrBox.show { display: flex; }
  #qrBox canvas, #qrBox img {
    background: #fff; padding: 12px;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  #keyLine {
    font-size: 12px; margin-top: 8px; color: var(--muted);
    word-break: break-all;
  }
  #keyLine .key {
    font-family: ui-monospace, monospace;
    background: #F1F3F4;
    padding: 3px 8px; border-radius: 6px;
    color: #333; font-size: 12px;
    display: inline-block; margin-top: 4px;
  }

  /* ---------- Scanner ---------- */
  .scanner {
    position: fixed; inset: 0;
    background: #000; z-index: 100;
    display: none;
    flex-direction: column;
  }
  .scanner.show { display: flex; }
  .scanner video {
    flex: 1; width: 100%; height: 100%;
    object-fit: cover;
  }
  .scanner .frame {
    position: absolute; top: 50%; left: 50%;
    width: 240px; height: 240px;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,255,255,0.85);
    border-radius: 20px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
    pointer-events: none;
  }
  .scanner .close {
    position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff;
    border: none; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .scanner .tip {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* ---------- Image viewer ---------- */
  .viewer {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.94);
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
  }
  .viewer.show { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .viewer img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" title="Ключ">⋯</button>
    <div class="title-block">
      <div class="title" id="chatTitle">QR Chat</div>
      <div class="subtitle">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Не подключено</span>
      </div>
    </div>
    <div style="width:40px"></div>
  </header>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <button class="icon-btn" id="photoBtn" title="Фото" disabled>📎</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <textarea id="msgInput" placeholder="Сообщение…" rows="1" disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4l-3 16-6-5-2 4-1-5 12-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>
</div>

<!-- Setup -->
<div class="overlay" id="setupOverlay">
  <div class="setup-card">
    <h2>QR Chat</h2>
    <p class="hint">Обмен ключами для защищённого чата</p>

    <button class="btn primary" id="genBtn">🔑 Создать ключ и показать QR</button>
    <button class="btn secondary" id="scanBtn">📷 Сканировать QR</button>

    <div id="qrBox"></div>
    <div id="keyLine"></div>

    <div class="divider">или</div>

    <div class="row">
      <input id="manualKey" placeholder="nfc-xxxxxxxxxxxxxxxx" autocomplete="off">
      <button class="btn secondary" id="manualBtn">OK</button>
    </div>
  </div>
</div>

<!-- Scanner -->
<div class="scanner" id="scannerOverlay">
  <video id="video" autoplay playsinline muted></video>
  <div class="frame"></div>
  <button class="close" id="stopScanBtn">✕</button>
  <div class="tip">Наведи на QR-код</div>
</div>

<!-- Viewer -->
<div class="viewer" id="viewer">
  <img id="viewerImg" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const chatEl = $('chat');
const msgInput = $('msgInput');
const sendBtn = $('sendBtn');
const photoBtn = $('photoBtn');
const fileInput = $('fileInput');
const statusDot = $('statusDot');
const statusText = $('statusText');
const setupOverlay = $('setupOverlay');
const scannerOverlay = $('scannerOverlay');
const video = $('video');
const viewer = $('viewer');
const viewerImg = $('viewerImg');

let topic = null;
let eventSource = null;
let mediaStream = null;
let scanInterval = null;
let senderId = Math.random().toString(36).slice(2, 10);

// ============ UI helpers ============
function setStatus(text, online = false) {
  statusText.textContent = text;
  statusDot.classList.toggle('on', online);
}

function addTextBubble(text, mine) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'me' : 'them');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function addImageBubble(url, caption, mine) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (mine ? 'me' : 'them');
  const b = document.createElement('div');
  b.className = 'bubble img';
  const img = document.createElement('img');
  img.src = url;
  img.loading = 'lazy';
  img.addEventListener('click', () => {
    viewerImg.src = url;
    viewer.classList.add('show');
  });
  b.appendChild(img);
  if (caption) {
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = caption;
    b.appendChild(cap);
  }
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function scrollBottom() {
  requestAnimationFrame(() => {
    chatEl.scrollTop = chatEl.scrollHeight;
  });
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ============ ntfy ============
function subscribe(t) {
  if (eventSource) eventSource.close();
  // since=none → только новые сообщения
  eventSource = new EventSource(`https://ntfy.sh/${encodeURIComponent(t)}/sse?since=none`);

  eventSource.onopen = () => setStatus('В сети', true);

  eventSource.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (d.event !== 'message') return;

    // Пропускаем свои же
    const tags = d.tags || [];
    const senderTag = tags.find(t => t.startsWith('sid-'));
    if (senderTag === 'sid-' + senderId) return;

    if (d.attachment && d.attachment.url) {
      addImageBubble(d.attachment.url, d.message || '', false);
    } else if (d.message) {
      addTextBubble(d.message, false);
    }
  };

  eventSource.onerror = () => {
    setStatus('Переподключение…', false);
  };
}

async function publishText(t, text) {
  const r = await fetch(`https://ntfy.sh/${encodeURIComponent(t)}`, {
    method: 'POST',
    body: text,
    headers: { 'Tags': 'sid-' + senderId }
  });
  if (!r.ok) throw new Error('ntfy ' + r.status);
}

async function publishImage(t, blob, caption = '') {
  const r = await fetch(`https://ntfy.sh/${encodeURIComponent(t)}`, {
    method: 'PUT',
    body: blob,
    headers: {
      'Filename': 'photo.jpg',
      'Message': caption || 'photo',
      'Tags': 'sid-' + senderId
    }
  });
  if (!r.ok) throw new Error('ntfy ' + r.status);
}

// ============ Topic setup ============
function randomTopic() {
  const arr = new Uint8Array(8);
  crypto.getRandomValues(arr);
  return 'nfc-' + Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
}

function setTopic(t) {
  topic = t.trim();
  subscribe(topic);
  msgInput.disabled = false;
  sendBtn.disabled = false;
  photoBtn.disabled = false;
  setupOverlay.classList.add('hidden');
  setStatus('В сети', true);
}

// ============ Generate QR ============
$('genBtn').addEventListener('click', () => {
  if (typeof QRCode === 'undefined') {
    alert('QR-библиотека не загрузилась');
    return;
  }
  const t = randomTopic();
  const qrBox = $('qrBox');
  qrBox.innerHTML = '';
  qrBox.classList.add('show');
  new QRCode(qrBox, {
    text: t, width: 220, height: 220,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
  $('keyLine').innerHTML = `Ключ: <span class="key">${t}</span>`;
  setTopic(t);
});

// ============ Scan QR ============
$('scanBtn').addEventListener('click', startScan);
$('stopScanBtn').addEventListener('click', stopScan);

async function startScan() {
  if (!window.isSecureContext) {
    alert('Нужен HTTPS для доступа к камере');
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('Камера недоступна в этом браузере');
    return;
  }
  if (!('BarcodeDetector' in window)) {
    alert('BarcodeDetector не поддерживается. Обнови Chrome.');
    return;
  }

  const tries = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } },
    { video: { facingMode: 'environment' } },
    { video: true }
  ];
  let stream = null, lastErr = null;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; }
  }
  if (!stream) {
    alert('Камера: ' + (lastErr ? lastErr.name : 'error'));
    return;
  }

  mediaStream = stream;
  video.srcObject = stream;
  scannerOverlay.classList.add('show');

  await new Promise(res => {
    if (video.readyState >= 1) return res();
    video.onloadedmetadata = () => res();
  });
  try { await video.play(); } catch {}
  await new Promise(r => setTimeout(r, 300));

  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  scanInterval = setInterval(async () => {
    if (video.readyState < 2 || video.videoWidth === 0) return;
    try {
      const codes = await detector.detect(video);
      if (codes && codes.length > 0) {
        const v = codes[0].rawValue;
        stopScan();
        setTopic(v);
      }
    } catch {}
  }, 250);
}

async function stopScan() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  video.srcObject = null;
  scannerOverlay.classList.remove('show');
}

// ============ Manual key ============
$('manualBtn').addEventListener('click', () => {
  const v = $('manualKey').value.trim();
  if (v) setTopic(v);
});

// ============ Send text ============
async function sendText() {
  const text = msgInput.value.trim();
  if (!text || !topic) return;
  msgInput.value = '';
  autoGrow(msgInput);
  addTextBubble(text, true);
  try { await publishText(topic, text); }
  catch (e) {
    setStatus('Ошибка отправки', false);
  }
}

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('input', () => autoGrow(msgInput));
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

// ============ Send photo ============
photoBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file || !topic) return;

  setStatus('Отправка фото…', true);
  try {
    const blob = await compressImage(file, 1600, 0.82);
    const localUrl = URL.createObjectURL(blob);
    addImageBubble(localUrl, '', true);
    await publishImage(topic, blob, '');
    setStatus('В сети', true);
  } catch (e) {
    setStatus('Ошибка: ' + e.message, false);
  }
});

async function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('load'));
    img.src = URL.createObjectURL(file);
  });
}

// ============ Viewer close ============
viewer.addEventListener('click', () => {
  viewer.classList.remove('show');
  viewerImg.src = '';
});

// ============ Menu (показать QR текущего ключа) ============
$('menuBtn').addEventListener('click', () => {
  if (!topic) return;
  setupOverlay.classList.remove('hidden');
  const qrBox = $('qrBox');
  qrBox.innerHTML = '';
  qrBox.classList.add('show');
  new QRCode(qrBox, {
    text: topic, width: 220, height: 220,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
  $('keyLine').innerHTML = `Ключ: <span class="key">${topic}</span>`;
});

window.addEventListener('beforeunload', () => {
  if (eventSource) eventSource.close();
  stopScan();
});
</script>
</body>
</html>
