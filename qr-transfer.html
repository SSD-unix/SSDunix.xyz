<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EDEDED" />
<title>QR Chat</title>
<style>
  :root {
    --green: #07C160;
    --bg: #EDEDED;
    --bubble-me: #95EC69;
    --bubble-them: #FFFFFF;
    --header: #F5F5F5;
    --border: rgba(0,0,0,0.06);
    --muted: #888;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: #111; font-size: 16px; overscroll-behavior: none; }
  .app { display: flex; flex-direction: column; height: 100dvh; height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  /* ---------- Шапка ---------- */
  .topbar { height: 52px; flex-shrink: 0; background: var(--header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; padding: 0 8px; }
  .topbar .title-block { flex: 1; text-align: center; min-width: 0; }
  .topbar .title { font-size: 15px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex-shrink: 0; transition: background 0.3s; }
  .dot.on { background: var(--green); box-shadow: 0 0 6px rgba(7,193,96,0.6); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; font-size: 20px; color: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
  .icon-btn:active { background: rgba(0,0,0,0.06); }

  /* ---------- Чат ---------- */
  .chat { flex: 1; overflow-y: auto; padding: 12px 12px 4px; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 2px; }
  .chat:empty::before { content: 'Чат пуст. Напиши первое сообщение.'; display: block; text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
  .day { text-align: center; font-size: 11px; color: var(--muted); margin: 12px 0 6px; }
  .day span { background: rgba(0,0,0,0.06); padding: 3px 10px; border-radius: 10px; }
  .msg-wrap { display: flex; flex-direction: column; margin-top: 6px; }
  .msg-wrap.same-sender { margin-top: 2px; }
  .msg-nick { font-size: 11px; color: #6b7280; margin: 0 8px 3px 8px; font-weight: 500; }
  .msg-wrap.me .msg-nick { text-align: right; color: #4b7a3a; }
  .msg-row { display: flex; width: 100%; animation: pop 0.18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: none; } }
  .msg-wrap.me .msg-row { justify-content: flex-end; }
  .msg-wrap.them .msg-row { justify-content: flex-start; }
  .bubble { max-width: 76%; padding: 9px 12px; border-radius: 18px; font-size: 15px; line-height: 1.35; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; box-shadow: 0 1px 1px rgba(0,0,0,0.04); }
  .msg-wrap.me .bubble { background: var(--bubble-me); color: #000; border-bottom-right-radius: 6px; }
  .msg-wrap.them .bubble { background: var(--bubble-them); color: #000; border-bottom-left-radius: 6px; }
  .msg-wrap.me.same-sender .bubble { border-bottom-right-radius: 18px; border-top-right-radius: 6px; }
  .msg-wrap.them.same-sender .bubble { border-bottom-left-radius: 18px; border-top-left-radius: 6px; }
  .bubble.img { padding: 4px; background: #fff; border-radius: 14px; max-width: 70%; }
  .bubble.img img { display: block; width: 100%; max-width: 260px; border-radius: 10px; cursor: pointer; }
  .bubble.broken { background: #ffecec; color: #b00; font-size: 12px; font-style: italic; }

  /* ---------- Composer ---------- */
  .composer { flex-shrink: 0; background: var(--header); border-top: 1px solid var(--border); padding: 8px; display: flex; align-items: flex-end; gap: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .composer textarea { flex: 1; min-height: 40px; max-height: 120px; padding: 10px 14px; font-size: 16px; font-family: inherit; border: none; border-radius: 20px; background: #fff; resize: none; outline: none; line-height: 20px; box-shadow: 0 0 0 1px rgba(0,0,0,0.04); }
  .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.1s; box-shadow: 0 2px 6px rgba(7,193,96,0.35); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: #C8C8C8; box-shadow: none; }
  .send-btn svg { width: 20px; height: 20px; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; inset: 0; background: linear-gradient(160deg, #f8f9fa 0%, #eaeef1 100%); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; overflow-y: auto; }
  .overlay.hidden { display: none; }
  .setup-card { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; padding: 24px 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.12); text-align: center; margin: auto; }
  .setup-card h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--green), #06AD56); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .setup-card .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; transition: transform 0.1s; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--green); color: #fff; box-shadow: 0 4px 12px rgba(7,193,96,0.3); }
  .btn.secondary { background: #F1F3F4; color: #222; }
  .btn.danger { background: #ffebee; color: #c62828; }
  .divider { color: var(--muted); font-size: 12px; margin: 14px 0 10px; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: #E0E0E0; }
  .divider::before { left: 0; } .divider::after { right: 0; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #E0E0E0; font-size: 15px; font-family: inherit; background: #FAFAFA; outline: none; }
  .row input:focus { border-color: var(--green); background: #fff; }
  .row .btn { width: auto; margin: 0; padding: 12px 20px; }
  #qrBox { margin: 16px auto 8px; display: none; justify-content: center; }
  #qrBox.show { display: flex; }
  #qrBox canvas, #qrBox img { background: #fff; padding: 12px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  #keyLine { font-size: 12px; margin-top: 8px; color: var(--muted); word-break: break-all; }
  #keyLine .key { font-family: ui-monospace, monospace; background: #F1F3F4; padding: 3px 8px; border-radius: 6px; color: #333; font-size: 12px; display: inline-block; margin-top: 4px; }
  .nick-badge { display: inline-block; padding: 4px 10px; background: var(--green); color: #fff; border-radius: 12px; font-size: 13px; font-weight: 600; margin: 8px 0; }

  /* ---------- Scanner ---------- */
  .scanner { position: fixed; inset: 0; background: #000; z-index: 100; display: none; flex-direction: column; }
  .scanner.show { display: flex; }
  .scanner video { flex: 1; width: 100%; height: 100%; object-fit: cover; }
  .scanner .frame { position: absolute; top: 50%; left: 50%; width: 240px; height: 240px; transform: translate(-50%, -50%); border: 3px solid rgba(255,255,255,0.85); border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); pointer-events: none; }
  .scanner .close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .scanner .tip { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

  /* ---------- Viewer ---------- */
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 200; display: none; align-items: center; justify-content: center; }
  .viewer.show { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ---------- Chain indicator ---------- */
  .chain-info { font-size: 10px; color: var(--muted); text-align: center; padding: 6px; }
  .chain-bad { color: #c62828; font-weight: 600; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" title="Меню">⋯</button>
    <div class="title-block">
      <div class="title" id="chatTitle">QR Chat</div>
      <div class="subtitle">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Не подключено</span>
      </div>
    </div>
    <button class="icon-btn" id="showQrBtn" title="QR ключа" disabled>⊞</button>
  </header>

  <main class="chat" id="chat"></main>

  <footer class="composer">
    <button class="icon-btn" id="photoBtn" title="Фото" disabled>📎</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <textarea id="msgInput" placeholder="Сообщение…" rows="1" disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4l-3 16-6-5-2 4-1-5 12-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>
</div>

<!-- Setup / Menu -->
<div class="overlay" id="setupOverlay">
  <div class="setup-card" id="setupCard">
    <!-- динамически -->
  </div>
</div>

<!-- Scanner -->
<div class="scanner" id="scannerOverlay">
  <video id="video" autoplay playsinline muted></video>
  <div class="frame"></div>
  <button class="close" id="stopScanBtn">✕</button>
  <div class="tip">Наведи на QR-код</div>
</div>

<!-- Viewer -->
<div class="viewer" id="viewer">
  <img id="viewerImg" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ================================================================
//  STATE
// ================================================================
const LS_KEY = 'qrchat_v3';
const $ = id => document.getElementById(id);

let state = {
  me: { sid: null, nick: null },
  topic: null,
  topics: {},         // topic -> { messages: [], lastTs: 0 }
  seenIds: {}         // topic -> Set (сериализуется в массив)
};

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch (e) { console.warn('load fail', e); }
  if (!state.me.sid) state.me.sid = randomId(8);
  if (!state.topics) state.topics = {};
  if (!state.seenIds) state.seenIds = {};
}
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) { console.warn('save fail', e); }
}
function randomId(len = 6) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('').slice(0, len);
}
function randomTopic() {
  return 'nfc-' + randomId(16);
}

// ================================================================
//  HASH CHAIN  (FNV-1a, синхронный)
// ================================================================
function fnv(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8);
}
function msgHash(m) {
  return fnv(`${m.prev || ''}|${m.id}|${m.sid}|${m.ts}|${m.type}|${m.text || ''}|${m.url || ''}`);
}
function verifyChain(messages) {
  let prev = '';
  for (const m of messages) {
    if (m.prev !== prev) return { ok: false, at: m.id };
    if (msgHash(m) !== m.hash) return { ok: false, at: m.id };
    prev = m.hash;
  }
  return { ok: true };
}

// ================================================================
//  STORAGE HELPERS
// ================================================================
function ensureTopic(t) {
  if (!state.topics[t]) state.topics[t] = { messages: [], lastTs: 0 };
  if (!state.seenIds[t]) state.seenIds[t] = [];
  return state.topics[t];
}
function hasSeen(t, id) {
  return state.seenIds[t].includes(id);
}
function markSeen(t, id) {
  if (!state.seenIds[t].includes(id)) state.seenIds[t].push(id);
  // держим максимум 1000 последних id
  if (state.seenIds[t].length > 1000) state.seenIds[t].splice(0, state.seenIds[t].length - 1000);
}
function lastHash(t) {
  const arr = state.topics[t]?.messages || [];
  return arr.length ? arr[arr.length - 1].hash : '';
}

// ================================================================
//  UI RENDER
// ================================================================
const chatEl = $('chat');
const msgInput = $('msgInput');
const sendBtn = $('sendBtn');
const photoBtn = $('photoBtn');
const fileInput = $('fileInput');
const statusDot = $('statusDot');
const statusText = $('statusText');
const chatTitle = $('chatTitle');

let renderedIds = new Set();
let lastSenderId = null;

function setStatus(text, online = false) {
  statusText.textContent = text;
  statusDot.classList.toggle('on', online);
}

function renderAll() {
  chatEl.innerHTML = '';
  renderedIds = new Set();
  lastSenderId = null;
  if (!state.topic) return;
  const arr = state.topics[state.topic]?.messages || [];
  if (!arr.length) return;

  // Проверка цепочки
  const v = verifyChain(arr);
  if (!v.ok) {
    const warn = document.createElement('div');
    warn.className = 'day';
    warn.innerHTML = `<span class="chain-bad">⚠️ Цепочка повреждена на ${v.at}</span>`;
    chatEl.appendChild(warn);
  }

  let lastDay = '';
  for (const m of arr) {
    const d = new Date(m.ts).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    if (d !== lastDay) {
      lastDay = d;
      const el = document.createElement('div');
      el.className = 'day';
      el.innerHTML = `<span>${d}</span>`;
      chatEl.appendChild(el);
      lastSenderId = null;
    }
    appendBubble(m, false);
    renderedIds.add(m.id);
  }
  scrollBottom(true);
}

function appendBubble(m, animate = true) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (m.sid === state.me.sid ? 'me' : 'them');
  if (m.sid === lastSenderId) wrap.classList.add('same-sender');

  // ник (для чужих и только если sender сменился)
  if (m.sid !== state.me.sid && m.sid !== lastSenderId) {
    const nick = document.createElement('div');
    nick.className = 'msg-nick';
    nick.textContent = m.nick || ('User ' + m.sid.slice(0, 4));
    wrap.appendChild(nick);
  }

  const row = document.createElement('div');
  row.className = 'msg-row';

  const b = document.createElement('div');
  b.className = 'bubble';

  if (m.type === 'image') {
    b.classList.add('img');
    const img = document.createElement('img');
    img.src = m.url;
    img.loading = 'lazy';
    img.addEventListener('click', () => {
      $('viewerImg').src = m.url;
      $('viewer').classList.add('show');
    });
    img.addEventListener('error', () => {
      b.classList.remove('img');
      b.classList.add('broken');
      b.textContent = '[фото недоступно: истекло хранение на ntfy]';
    });
    b.appendChild(img);
    if (m.text) {
      const cap = document.createElement('div');
      cap.style.cssText = 'font-size:13px;padding:6px 6px 2px;';
      cap.textContent = m.text;
      b.appendChild(cap);
    }
  } else {
    b.textContent = m.text || '';
  }

  row.appendChild(b);
  wrap.appendChild(row);
  if (animate) {
    wrap.style.animation = 'pop 0.18s ease-out';
  }
  chatEl.appendChild(wrap);
  lastSenderId = m.sid;
}

function scrollBottom(instant = false) {
  if (instant) chatEl.scrollTop = chatEl.scrollHeight;
  else requestAnimationFrame(() => chatEl.scrollTop = chatEl.scrollHeight);
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ================================================================
//  NETWORK (ntfy.sh)
// ================================================================
let eventSource = null;

function connect() {
  if (!state.topic) return;
  if (eventSource) { eventSource.close(); eventSource = null; }

  const t = state.topic;
  const info = ensureTopic(t);
  const since = info.lastTs ? Math.floor(info.lastTs / 1000) : 'all';
  const url = `https://ntfy.sh/${encodeURIComponent(t)}/sse?since=${since}`;
  eventSource = new EventSource(url);

  eventSource.onopen = () => setStatus('В сети (' + countUsers(t) + ' чел.)', true);

  eventSource.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (d.event !== 'message') return;

    let meta = null;
    try { meta = JSON.parse(d.message || '{}'); } catch { return; }

    // Валидация
    if (!meta.id || !meta.sid) return;
    if (hasSeen(t, meta.id)) return;
    if (d.attachment?.url) meta.url = d.attachment.url;

    // Достраиваем то, что пришло без типа (старые версии)
    if (!meta.type) meta.type = meta.url ? 'image' : 'text';
    if (typeof meta.ts !== 'number') meta.ts = (d.time || Math.floor(Date.now() / 1000)) * 1000;
    if (!meta.nick) meta.nick = 'User ' + meta.sid.slice(0, 4);

    markSeen(t, meta.id);
    ingestMessage(meta);
  };

  eventSource.onerror = () => setStatus('Переподключение…', false);
}

function countUsers(t) {
  const arr = state.topics[t]?.messages || [];
  const sids = new Set(arr.map(m => m.sid));
  return sids.size;
}

function ingestMessage(meta) {
  const t = state.topic;
  const info = ensureTopic(t);
  info.messages.push(meta);
  info.messages.sort((a, b) => a.ts - b.ts);
  if (meta.ts > info.lastTs) info.lastTs = meta.ts;
  saveState();

  if (!renderedIds.has(meta.id)) {
    appendBubble(meta, true);
    renderedIds.add(meta.id);
    scrollBottom();
  }

  chatTitle.textContent = 'QR Chat · ' + countUsers(t) + ' чел.';
}

async function sendMessage(meta) {
  const t = state.topic;
  const info = ensureTopic(t);

  meta.id = meta.id || randomId(12);
  meta.sid = state.me.sid;
  meta.nick = state.me.nick;
  meta.ts = Date.now();
  meta.prev = lastHash(t);
  meta.hash = msgHash(meta);

  // 1) сначала локально
  markSeen(t, meta.id);
  ingestMessage(meta);

  // 2) потом в сеть
  const body = JSON.stringify(meta);
  const headers = { 'Title': state.me.nick };

  try {
    let r;
    if (meta.type === 'image' && meta._blob) {
      // картинка — PUT с attachment
      r = await fetch(`https://ntfy.sh/${encodeURIComponent(t)}`, {
        method: 'PUT',
        body: meta._blob,
        headers: { ...headers, 'Filename': 'photo.jpg', 'Message': body }
      });
      delete meta._blob;
    } else {
      r = await fetch(`https://ntfy.sh/${encodeURIComponent(t)}`, {
        method: 'POST',
        body,
        headers
      });
    }
    if (!r.ok) throw new Error('ntfy ' + r.status);
    setStatus('В сети (' + countUsers(t) + ' чел.)', true);
  } catch (e) {
    setStatus('Ошибка отправки: ' + e.message, false);
  }
}

// ================================================================
//  UI: SETUP / MENU
// ================================================================
function showSetup() {
  const card = $('setupCard');
  if (state.topic && state.me.nick) {
    // Меню
    card.innerHTML = `
      <h2>Настройки</h2>
      <p class="hint">Ты в чате как <b>${escapeHtml(state.me.nick)}</b></p>
      <button class="btn primary" id="showQrBtn2">⊞ Показать QR текущего ключа</button>
      <button class="btn secondary" id="changeNickBtn">✎ Сменить ник</button>
      <button class="btn secondary" id="continueBtn">← Вернуться в чат</button>
      <div class="divider">или</div>
      <button class="btn secondary" id="joinOtherBtn">🔑 Войти в другой чат</button>
      <button class="btn danger" id="leaveBtn">🚪 Выйти и удалить историю</button>
      <div id="qrBox"></div>
      <div id="keyLine"></div>
    `;
    $('showQrBtn2').addEventListener('click', () => showQr(state.topic));
    $('changeNickBtn').addEventListener('click', changeNick);
    $('continueBtn').addEventListener('click', hideSetup);
    $('joinOtherBtn').addEventListener('click', () => showJoinMode());
    $('leaveBtn').addEventListener('click', leaveChat);
  } else {
    // Приветствие (первый раз)
    card.innerHTML = `
      <h2>QR Chat</h2>
      <p class="hint">Мульти-юзер чат с цепочкой истории</p>
      <input id="nickInput" placeholder="Твой ник" maxlength="24" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #E0E0E0;font-size:15px;font-family:inherit;background:#FAFAFA;outline:none;margin-bottom:10px;" />
      <button class="btn primary" id="saveNickBtn">Продолжить</button>
      <div class="divider">или</div>
      <button class="btn secondary" id="joinOtherBtn2">🔑 Войти по ключу</button>
      <div id="qrBox"></div>
      <div id="keyLine"></div>
    `;
    $('saveNickBtn').addEventListener('click', () => {
      const v = $('nickInput').value.trim() || ('User-' + state.me.sid.slice(0, 4));
      state.me.nick = v.slice(0, 24);
      saveState();
      showSetup();
    });
    $('joinOtherBtn2').addEventListener('click', () => showJoinMode());
  }
}

function showJoinMode() {
  const card = $('setupCard');
  card.innerHTML = `
    <h2>Войти в чат</h2>
    <p class="hint">Отсканируй QR у друга или введи ключ</p>
    <button class="btn primary" id="scanBtn">📷 Сканировать QR</button>
    <button class="btn secondary" id="createBtn">✨ Создать новый чат</button>
    <div class="divider">или</div>
    <div class="row">
      <input id="manualKey" placeholder="nfc-xxxxxxxxxxxxxxxx" autocomplete="off">
      <button class="btn secondary" id="manualBtn">OK</button>
    </div>
    <button class="btn secondary" id="backBtn" style="margin-top:12px;">← Назад</button>
    <div id="qrBox"></div>
    <div id="keyLine"></div>
  `;
  $('scanBtn').addEventListener('click', startScan);
  $('createBtn').addEventListener('click', () => {
    const t = randomTopic();
    joinTopic(t);
  });
  $('manualBtn').addEventListener('click', () => {
    const v = $('manualKey').value.trim();
    if (v) joinTopic(v);
  });
  $('backBtn').addEventListener('click', showSetup);
}

function changeNick() {
  const cur = state.me.nick || '';
  const v = prompt('Новый ник:', cur);
  if (v === null) return;
  const trimmed = v.trim().slice(0, 24);
  if (!trimmed) return;
  state.me.nick = trimmed;
  saveState();
  showSetup();
}

function showQr(topic) {
  const qrBox = $('qrBox');
  qrBox.innerHTML = '';
  qrBox.classList.add('show');
  new QRCode(qrBox, {
    text: topic, width: 220, height: 220,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
  $('keyLine').innerHTML = `Ключ:<br><span class="key">${topic}</span>`;
}

function hideSetup() { $('setupOverlay').classList.add('hidden'); }

function joinTopic(t) {
  t = t.trim();
  if (!t) return;
  state.topic = t;
  ensureTopic(t);
  saveState();
  chatTitle.textContent = 'QR Chat';
  connect();
  renderAll();
  enableComposer(true);
  hideSetup();
  setStatus('В сети', true);
}

function leaveChat() {
  if (!confirm('Выйти из чата и удалить всю локальную историю по нему?')) return;
  const t = state.topic;
  if (t) {
    delete state.topics[t];
    delete state.seenIds[t];
  }
  state.topic = null;
  saveState();
  if (eventSource) { eventSource.close(); eventSource = null; }
  renderAll();
  enableComposer(false);
  chatTitle.textContent = 'QR Chat';
  setStatus('Не подключено', false);
  showSetup();
}

function enableComposer(on) {
  msgInput.disabled = !on;
  sendBtn.disabled = !on;
  photoBtn.disabled = !on;
  $('showQrBtn').disabled = !on;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ================================================================
//  QR SCAN
// ================================================================
let mediaStream = null, scanInterval = null;

async function startScan() {
  if (!window.isSecureContext) { alert('Нужен HTTPS'); return; }
  if (!navigator.mediaDevices?.getUserMedia) { alert('Камера недоступна'); return; }
  if (!('BarcodeDetector' in window)) { alert('BarcodeDetector не поддерживается. Обнови Chrome.'); return; }

  const tries = [
    { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } },
    { video: { facingMode: 'environment' } },
    { video: true }
  ];
  let stream = null, lastErr = null;
  for (const c of tries) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; }
  }
  if (!stream) { alert('Камера: ' + (lastErr ? lastErr.name : 'error')); return; }

  mediaStream = stream;
  const video = $('video');
  video.srcObject = stream;
  $('scannerOverlay').classList.add('show');
  await new Promise(res => { if (video.readyState >= 1) res(); else video.onloadedmetadata = () => res(); });
  try { await video.play(); } catch {}
  await new Promise(r => setTimeout(r, 300));

  const detector = new BarcodeDetector({ formats: ['qr_code'] });
  scanInterval = setInterval(async () => {
    if (video.readyState < 2 || video.videoWidth === 0) return;
    try {
      const codes = await detector.detect(video);
      if (codes?.length) {
        const v = codes[0].rawValue;
        stopScan();
        joinTopic(v);
      }
    } catch {}
  }, 250);
}
async function stopScan() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  $('video').srcObject = null;
  $('scannerOverlay').classList.remove('show');
}

// ================================================================
//  SENDING
// ================================================================
async function sendText() {
  const text = msgInput.value.trim();
  if (!text || !state.topic) return;
  msgInput.value = '';
  autoGrow(msgInput);
  await sendMessage({ type: 'text', text });
}

sendBtn.addEventListener('click', sendText);
msgInput.addEventListener('input', () => autoGrow(msgInput));
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

photoBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file || !state.topic) return;
  setStatus('Отправка фото…', true);
  try {
    const blob = await compressImage(file, 1600, 0.82);
    const localUrl = URL.createObjectURL(blob);
    await sendMessage({ type: 'image', url: localUrl, text: '', _blob: blob });
  } catch (e) {
    setStatus('Ошибка: ' + e.message, false);
  }
});

function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('load'));
    img.src = URL.createObjectURL(file);
  });
}

// ================================================================
//  MISC
// ================================================================
$('menuBtn').addEventListener('click', () => { showSetup(); $('setupOverlay').classList.remove('hidden'); });
$('showQrBtn').addEventListener('click', () => {
  if (!state.topic) return;
  showSetup();
  $('setupOverlay').classList.remove('hidden');
  showQr(state.topic);
});
$('stopScanBtn').addEventListener('click', stopScan);
$('viewer').addEventListener('click', () => {
  $('viewer').classList.remove('show');
  $('viewerImg').src = '';
});

// ================================================================
//  BOOT
// ================================================================
loadState();

if (state.me.nick && state.topic) {
  // Восстанавливаем чат без QR
  chatTitle.textContent = 'QR Chat';
  renderAll();
  enableComposer(true);
  connect();
  hideSetup();
} else if (state.me.nick && !state.topic) {
  showSetup();
  $('setupOverlay').classList.remove('hidden');
  showJoinMode();
} else {
  showSetup();
  $('setupOverlay').classList.remove('hidden');
}

window.addEventListener('beforeunload', () => {
  if (eventSource) eventSource.close();
  stopScan();
});
</script>
