<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TESTOSTERONE SSH</title>
  <style>
    body { 
      background: #000; 
      color: #00ff00; 
      font-family: monospace; 
      margin: 0; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      box-sizing: border-box; 
      font-size: 16px; 
    }
    #toolbar { padding-bottom: 10px; border-bottom: 1px solid #00ff00; margin-bottom: 15px; }
    button { background: #00ff00; color: #000; border: none; padding: 5px 15px; font-weight: bold; cursor: pointer; font-family: monospace; }
    button:hover { background: #fff; }
    #output { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; }
    #input-line { display: flex; align-items: center; margin-top: 10px; }
    #prompt { margin-right: 8px; font-weight: bold; }
    #cmd { background: transparent; border: none; color: #00ff00; font-family: monospace; font-size: 16px; flex-grow: 1; outline: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="connectBtn" onclick="connectSerial()">[ Connect to /dev/ttyACM0 ]</button>
  </div>
  
  <div id="output">TESTOSTERONE OS Pseudo-SSH Terminal.<br>Awaiting connection to Mega 2560...<br></div>
  
  <div id="input-line" style="display:none;">
    <span id="prompt">root@mega2560:~#</span>
    <input type="text" id="cmd" autocomplete="off" autofocus>
  </div>

  <script>
    const output = document.getElementById('output');
    const cmdInput = document.getElementById('cmd');
    const inputLine = document.getElementById('input-line');
    const connectBtn = document.getElementById('connectBtn');
    let port, writer;

    function printText(text) {
      output.innerHTML += text.replace(/\n/g, '<br>');
      output.scrollTop = output.scrollHeight;
    }

    async function connectSerial() {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        
        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();
        
        connectBtn.style.display = 'none';
        document.getElementById('toolbar').style.display = 'none';
        inputLine.style.display = 'flex';
        cmdInput.focus();
        
        printText("\nSYS: Connection established. Type 'help'.\n");
        readLoop();
      } catch (e) {
        printText("\nERR: Connection failed. " + e.message + "\n");
      }
    }

    // Отправка команды при нажатии Enter
    cmdInput.addEventListener('keypress', async function(e) {
      if (e.key === 'Enter') {
        const command = cmdInput.value;
        printText("root@mega2560:~# " + command + "\n"); // Печатаем команду в консоль браузера
        cmdInput.value = '';
        
        if (writer) {
          await writer.write(command + '\n'); // Отправляем байты в Мегу
        }
      }
    });

    // Бесконечное чтение ответов от платы
    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      const reader = textDecoder.readable.getReader();
      
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          printText(value);
        }
      } catch (e) {
        printText("\nERR: Serial read error. " + e.message + "\n");
      } finally {
        reader.releaseLock();
      }
    }
  </script>
</body>
</html>
