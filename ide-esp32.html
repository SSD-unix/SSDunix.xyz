<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TESTOSTERONE Static IDE</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
  <style>
    body { margin: 0; background: #121212; display: flex; flex-direction: column; height: 100vh; font-family: monospace; color: #fff;}
    #toolbar { padding: 15px; background: #222; display: flex; gap: 10px; align-items: center; border-bottom: 2px solid #333;}
    input { padding: 5px; background: #111; color: #0f0; border: 1px solid #444; font-family: monospace; }
    button { background: #4caf50; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
    button:hover { background: #45a049; }
    #editor { flex-grow: 1; font-size: 16px; }
    #console { height: 200px; background: #000; color: #00ff00; padding: 10px; overflow-y: auto; white-space: pre-wrap;}
  </style>
</head>
<body>
  <div id="toolbar">
    <span>ESP32 IP:</span>
    <input type="text" id="esp-ip" value="192.168.x.x" placeholder="192.168...">
    <button onclick="runCode()">▶ Deploy & Run</button>
  </div>
  <div id="editor"># Скрипт мигания диодом
pinmode 2 out

# Включаем
write 2 1
sleep 1000

# Выключаем
write 2 0
</div>
  <div id="console">SYS: IDE Ready.\n</div>
  
  <script>
    var editor = ace.edit("editor");
    editor.setTheme("ace/theme/monokai");
    editor.session.setMode("ace/mode/sh"); // Подсветка как у bash скриптов
    
    function log(msg) {
      const cons = document.getElementById('console');
      cons.innerText += msg + "\n";
      cons.scrollTop = cons.scrollHeight;
    }

    async function runCode() {
      const ip = document.getElementById('esp-ip').value;
      const code = editor.getValue();
      
      log("SYS: Sending script to " + ip + "...");
      
      try {
        const response = await fetch(`http://${ip}/api/run`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: code
        });
        
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const output = await response.text();
        log(output || "SYS: Script executed (no output).");
      } catch (error) {
        log("ERR: Failed to connect. Check IP and CORS. Details: " + error.message);
      }
    }
  </script>
</body>
</html>
