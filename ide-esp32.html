<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wave IDE - Serial Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
  <style>
    body { margin: 0; background: #0b0c10; display: flex; flex-direction: column; height: 100vh; font-family: monospace; color: #c5c6c7;}
    #toolbar { padding: 15px; background: #1f2833; display: flex; gap: 15px; align-items: center; border-bottom: 2px solid #45a29e;}
    .logo { font-size: 20px; font-weight: bold; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; margin-right: 20px;}
    button { background: #45a29e; color: #0b0c10; border: none; padding: 8px 20px; cursor: pointer; font-weight: bold; border-radius: 3px; transition: 0.2s;}
    button:hover { background: #66fcf1; }
    button:disabled { background: #555; cursor: not-allowed; color: #888; }
    #editor { flex-grow: 1; font-size: 16px; }
    #console { height: 220px; background: #000; color: #66fcf1; padding: 15px; overflow-y: auto; white-space: pre-wrap; border-top: 1px solid #1f2833;}
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="logo">🌊 Wave IDE</div>
    <button id="connectBtn" onclick="connectSerial()">🔌 Connect USB</button>
    <button id="deployBtn" onclick="runCode()" disabled>▶ Deploy via Cable</button>
  </div>
  <div id="editor"># Wave IDE - Direct USB deployment
pinmode 2 out

write 2 1
sleep 500
write 2 0
sleep 500
write 2 1
</div>
  <div id="console">WAVE SYS: IDE Initialized. Awaiting USB connection...\n</div>
  
  <script>
    var editor = ace.edit("editor");
    editor.setTheme("ace/theme/tomorrow_night_eighties");
    editor.session.setMode("ace/mode/sh");
    
    function log(msg) {
      const cons = document.getElementById('console');
      cons.innerText += msg + "\n";
      cons.scrollTop = cons.scrollHeight;
    }

    let port;
    let writer;

    async function connectSerial() {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        
        const textEncoder = new TextEncoderStream();
        textEncoder.readable.pipeTo(port.writable);
        writer = textEncoder.writable.getWriter();
        
        document.getElementById('connectBtn').innerText = 'USB Connected';
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('deployBtn').disabled = false;
        
        log("WAVE SYS: Port opened at 115200 baud.");
        readLoop(); // Запускаем слушатель ответов
      } catch (e) {
        log("ERR: Connection failed. " + e.message);
      }
    }

    async function runCode() {
      const code = editor.getValue();
      log("WAVE SYS: Flashing script...");
      try {
        await writer.write(code + '\x04'); // Добавляем EOT в конец скрипта
      } catch (e) {
        log("ERR: Failed to write. " + e.message);
      }
    }

    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      const reader = textDecoder.readable.getReader();
      
      let buffer = "";
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += value;
          // Если получили EOT от платы, выводим буфер и очищаем его
          if (buffer.includes('\x04')) {
            let output = buffer.replace('\x04', '');
            if (output.trim().length > 0) log(output);
            else log("WAVE SYS: Execution complete (no output).");
            buffer = "";
          }
        }
      } catch (e) {
        log("ERR: Read error. " + e.message);
      } finally {
        reader.releaseLock();
      }
    }
  </script>
</body>
</html>
