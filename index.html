<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SSDunix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #172554);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: #e6eef8;
  min-height: 100vh;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container { 
  max-width: 900px; 
  margin: 0 auto; 
  padding: 50px 20px; 
}

.fade-in {
  opacity: 0;
  animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.3s; }
.delay-3 { animation-delay: 0.5s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

header { 
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  text-align: center; 
  margin-bottom: 40px; 
}

header h1 { 
  font-size: 56px; 
  font-weight: 700; 
  margin: 0 0 10px 0; 
  color: #fff; 
  text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); 
  letter-spacing: -1px;
}

header nav { font-size: 16px; margin: 8px 0; color: #94a3b8; }
header nav a { 
  color: #38bdf8; 
  text-decoration: none; 
  font-weight: 500;
  transition: 0.3s; 
}
header nav a:hover { color: #bae6fd; text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }

/* Умный блок выбора 2000 языков */
.lang-container {
  margin-top: 25px;
  width: 100%;
  max-width: 800px;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  padding: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.lang-search {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid rgba(56, 189, 248, 0.3);
  background: rgba(2, 6, 23, 0.6);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
  margin-bottom: 15px;
  transition: all 0.3s ease;
}

.lang-search:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
}

.lang-selector { 
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap; 
  justify-content: flex-start; 
  max-height: 180px; 
  overflow-y: auto; 
  padding-right: 5px;
}

.lang-selector::-webkit-scrollbar { width: 6px; }
.lang-selector::-webkit-scrollbar-track { background: transparent; }
.lang-selector::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 6px; }

.lang-selector button { 
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 6px 12px; 
  border-radius: 10px; 
  color: #e2e8f0; 
  cursor: pointer; 
  font-family: inherit;
  font-size: 13px; 
  font-weight: 500; 
  transition: all 0.2s ease; 
}

.lang-selector button:hover { 
  background: #38bdf8; 
  color: #0f172a;
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
  border-color: #38bdf8;
}

.card { 
  background: rgba(15, 23, 42, 0.5); 
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 35px; 
  border-radius: 20px; 
  margin-top: 25px; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
  transition: all 0.4s ease; 
}

.card:hover { 
  transform: translateY(-5px); 
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.1); 
  border-color: rgba(56, 189, 248, 0.2);
}

h2 { 
  font-size: 28px; 
  margin-top: 0; 
  color: #f1f5f9; 
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

h2::before {
  content: "";
  display: block;
  width: 12px;
  height: 12px;
  background: #38bdf8;
  border-radius: 50%;
  box-shadow: 0 0 10px #38bdf8;
}

p {
  line-height: 1.7;
  color: #cbd5e1;
  font-size: 16px;
}

a { color: #38bdf8; transition: 0.3s; text-decoration: none;}
a:hover { color: #bae6fd; text-decoration: underline; }

.repo { 
  padding: 20px; 
  border-radius: 16px; 
  border-left: 4px solid #0ea5e9; 
  margin: 15px 0; 
  background: rgba(30, 41, 59, 0.4); 
  transition: all 0.3s ease;
  border-right: 1px solid transparent;
  border-top: 1px solid transparent;
  border-bottom: 1px solid transparent;
  opacity: 0;
}

.repo:hover { 
  background: rgba(30, 41, 59, 0.8); 
  transform: translateX(5px);
  border-color: #38bdf8;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

.repo strong a { font-size: 18px; color: #fff; }
.repo div { margin-top: 8px; line-height: 1.5; color: #94a3b8; }

.muted { 
  color: #64748b !important; 
  font-size: 13px; 
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

footer { 
  margin-top: 60px; 
  font-size: 14px; 
  color: #64748b; 
  text-align: center; 
  padding-bottom: 20px;
}

@media (max-width: 600px){
  .container { padding: 30px 15px; }
  header h1 { font-size: 42px; }
  h2 { font-size: 24px; }
  .card { padding: 25px; }
}
</style>
</head>
<body>
<div class="container">
  <header class="fade-in">
    <h1 id="site-title">SSDunix</h1>
    <nav id="github-link">GitHub: <a href="https://github.com/SSD-unix" target="_blank">@SSD-unix</a></nav>
    
    <!-- Панель на 2000 языков -->
    <div class="lang-container">
      <input type="text" id="lang-search" class="lang-search" placeholder="Поиск среди 2000 языков и диалектов / Search...">
      <div class="lang-selector" id="lang-buttons">
        <!-- Кнопки генерируются алгоритмом JS -->
      </div>
    </div>
  </header>

  <section class="card fade-in delay-1" id="about">
    <h2 id="about-title">О проекте</h2>
    <p id="about-text">Загрузка...</p>
    <p id="news-text">Загрузка...</p>
  </section>

  <section class="card fade-in delay-2" id="about-me">
    <h2 id="about-me-title">Обо мне</h2>
    <p id="about-me-text">Загрузка...</p>
  </section>

  <section class="card fade-in delay-3" id="github">
    <h2 id="repos-title">GitHub репозитории</h2>
    <div id="repos" style="color: #94a3b8; font-style: italic;">Загрузка...</div>
  </section>

  <footer id="footer-text" class="fade-in delay-3">© SSDunix</footer>
</div>

<script>
// 1. Базовые языки (строго исключены tr и az)
const baseLangs = ["ru","en","hy","uk","pl","es","fr","de","it","pt","zh","ja","ko","ar","hi","nl","sv","el","he","cs","ro","hu","fi","da","ka","bg","sr","hr","sl","sk","be","kk","uz","tg","mn","th","vi","id","ms","tl","bn","ta","te","mr","ur","fa","am","sw","af","sq","mk","bs","mt","cy","is","ga","eu","gl","ca","lt","lv","et","km","lo","my","ml","kn","gu","pa","si","ne","so","mg","ny","sn","ab","aa","ak","an","as","av","ae","ay","ba","bm","bh","bi","br","ce","ch","co","cr","cu","cv","dv","dz","ee","eo","ff","fj","fo","fy","gd","gn","gv","ha","ho","ht","hz","ia","ie","ig","ii","ik","io","iu","jv","kg","ki","kj","kl","kr","ks","ku","kv","kw","ky","la","lb","lg","li","ln","lu","mh","mi","na","nb","nd","ng","nn","no","nr","nv","oc","oj","om","or","os","pi","qu","rm","rn","rw","sa","sc","sd","se","sg","sm","ss","st","su","ti","tk","tn","to","ts","tt","tw","ty","ug","ve","vo","wa","wo","xh","yi","yo","za","zu"];

// Двойная проверка безопасности
const safeLangs = baseLangs.filter(l => l !== 'tr' && l !== 'az');

// 2. Региональные коды (сотни стран)
const regions = ["US","GB","CA","AU","NZ","IE","ZA","IN","FR","DE","IT","ES","MX","AR","CO","PE","VE","CL","EC","GT","CU","BR","PT","CN","TW","HK","SG","MO","JP","KR","RU","BY","KZ","KG","UA","PL","CZ","SK","HU","RO","BG","GR","IL","IR","AF","PK","BD","LK","VN","TH","ID","MY","PH","KE","TZ","UG","NG","EG","SA","AE","IQ","DZ","MA","TN","JO","LB","KW","QA","BH","OM","YE","SY","LY","SD","AM","GE","CH","AT","BE","LU","MC","NL","SE","FI","DK","NO","RS","HR","BA","ME","MK","AL","MT","CY","IS","EE","LV","LT","KH","LA","MM","NP","BT","ZW","MW","MG","SO","DJ","ER","TJ","TM","GL","PR","DO","HN","PY","SV","NI","CR","PA","UY","BO","SN","CI","CM","ML","BF","NE","GN","RW","HT","AO","MZ","CV","GW","ST","TL","MR","KM","SS","TD","SM","VA","AW","CW","SR","SX","AX","AS","BI","BW","CX","FJ","GM","GH","GY","IM","JE","KI","LS","MU","NA","NR","SC","SL","SZ","VU","ZM","BJ","CD","CF","CG","GA","GQ","NC","PF","PM","RE","TG","WF","YT"];

const codesArray = [];

// Сначала добавляем чистые базы
safeLangs.forEach(l => { 
  if(codesArray.length < 2000) codesArray.push(l); 
});

// Затем алгоритмически скрещиваем базы с регионами, пока не добьем ровно до 2000
for (let i = 0; i < safeLangs.length; i++) {
  for (let j = 0; j < regions.length; j++) {
    if (codesArray.length >= 2000) break;
    // Пример: es-JP (испанский в Японии), ru-US (русский в США)
    codesArray.push(`${safeLangs[i]}-${regions[j]}`);
  }
  if (codesArray.length >= 2000) break;
}

// 3. Вытягиваем красивые родные названия напрямую из движка браузера
const langNames = {};
codesArray.forEach(code => {
  try {
    const nativeName = new Intl.DisplayNames([code], { type: 'language' }).of(code);
    langNames[code] = nativeName.charAt(0).toUpperCase() + nativeName.slice(1);
  } catch (e) {
    langNames[code] = code.toUpperCase();
  }
});

// Основной ручной перевод для интерфейса
const baseTexts = {
  "ru": {
    "site-title":"SSDunix", "about-title":"О проекте",
    "about-text":"SSDunix — это сайт, посвящённый моим проектам и разработкам. Здесь вы найдете мои эксперименты с Python, PyQt, созданием инструментов и сервисов, а также полезные заметки для программистов и энтузиастов IT. Моя цель — создать платформу, где каждый проект может быть представлен красиво и удобно.",
    "news-text":"Также читайте новости на <a href='https://news.ssdunix.xyz' target='_blank'>news.ssdunix.xyz</a>",
    "about-me-title":"Обо мне",
    "about-me-text":"Мне нравится изучать Linux, создавать собственные инструменты и экспериментировать с программированием. Я увлекаюсь PyQt, веб-разработкой и поиском нестандартных решений. SSDunix — это место, где я выкладываю свои проекты и делюсь опытом с другими. Моя философия — учиться через создание и эксперимент.",
    "repos-title":"GitHub репозитории", "footer-text":"© SSDunix"
  },
  "en": {
    "site-title":"SSDunix", "about-title":"About the project",
    "about-text":"SSDunix is a website dedicated to my projects and developments. Here you can find my experiments with Python, PyQt, tool creation, and useful notes for programmers and IT enthusiasts. My goal is to create a platform where every project is presented beautifully and clearly.",
    "news-text":"Also read news at <a href='https://news.ssdunix.xyz' target='_blank'>news.ssdunix.xyz</a>",
    "about-me-title":"About Me",
    "about-me-text":"I enjoy exploring Linux, creating my own tools, and experimenting with programming. I love PyQt, web development, and finding unconventional solutions. SSDunix is where I share my projects and experiences with others. My philosophy is learning through creation and experimentation.",
    "repos-title":"GitHub Repositories", "footer-text":"© SSDunix"
  }
};

// Динамический генератор интерфейса для 2000 языков
function getTranslations(code) {
  const shortCode = code.split('-')[0];
  if (baseTexts[shortCode]) return baseTexts[shortCode];
  
  return {
    "site-title": "SSDunix",
    "about-title": langNames[code] + " - Project",
    "about-text": baseTexts['en']['about-text'], 
    "news-text": `News: <a href='https://news.ssdunix.xyz' target='_blank'>news.ssdunix.xyz</a>`,
    "about-me-title": langNames[code] + " - About",
    "about-me-text": baseTexts['en']['about-me-text'],
    "repos-title": `GitHub Repositories`,
    "footer-text": "© SSDunix"
  };
}

// Рендер 2000 кнопок (с оптимизацией под поиск)
const btnContainer = document.getElementById('lang-buttons');
const searchInput = document.getElementById('lang-search');

function renderButtons(filter = '') {
  btnContainer.innerHTML = '';
  // Ограничиваем рендер до 150 элементов за раз, чтобы браузер не лагал при наборе текста,
  // если ничего не введено — рендерим все 2000, браузер справится.
  const isFiltering = filter.length > 0;
  let count = 0;
  
  Object.keys(langNames).forEach(k => {
    const name = langNames[k];
    if (name.toLowerCase().includes(filter.toLowerCase()) || k.toLowerCase().includes(filter.toLowerCase())) {
      if (isFiltering && count > 150) return;
      const btn = document.createElement('button');
      btn.innerText = name;
      btn.onclick = () => setLanguage(k);
      btnContainer.appendChild(btn);
      count++;
    }
  });
}

renderButtons();

// Логика поиска
searchInput.addEventListener('input', (e) => {
  renderButtons(e.target.value);
});

// Установка языка
let userLang = navigator.language || navigator.userLanguage;
let currentLang = codesArray.includes(userLang) ? userLang : "ru";

function setLanguage(l){
  currentLang = l;
  const shortL = l.split('-')[0];
  
  // Умный RTL (арабский, иврит, фарси, урду, уйгурский и др.)
  if(['ar', 'he', 'fa', 'ur', 'ug', 'yi', 'dz', 'dv'].includes(shortL)) {
    document.body.style.direction = 'rtl';
  } else {
    document.body.style.direction = 'ltr';
  }
  
  const t = getTranslations(l);
  document.getElementById("site-title").innerHTML = t["site-title"];
  document.getElementById("about-title").innerHTML = t["about-title"];
  document.getElementById("about-text").innerHTML = t["about-text"];
  document.getElementById("news-text").innerHTML = t["news-text"];
  document.getElementById("about-me-title").innerHTML = t["about-me-title"];
  document.getElementById("about-me-text").innerHTML = t["about-me-text"];
  document.getElementById("repos-title").innerHTML = t["repos-title"];
  document.getElementById("footer-text").innerHTML = t["footer-text"];
}

setLanguage(currentLang);

// GitHub API
(async function(){
  const container = document.getElementById('repos');
  try{
    const res = await fetch('https://api.github.com/users/SSD-unix/repos');
    const repos = await res.json();
    container.innerHTML = '';
    repos.sort((a,b)=> new Date(b.updated_at)-new Date(a.updated_at));
    
    repos.forEach((r, index) => {
      const el = document.createElement('div'); 
      el.className = 'repo';
      el.style.animation = `fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) ${index * 0.15}s forwards`;
      
      const langText = r.language ? r.language : 'Shell';
      const dateText = new Date(r.updated_at).toLocaleDateString();
      
      el.innerHTML = `<strong><a href="${r.html_url}" target="_blank">${r.name}</a></strong>
                      <div class="muted">${langText} • ${dateText}</div>
                      <div>${r.description || 'Без описания / No description'}</div>`;
      container.appendChild(el);
    });
    
    if(repos.length === 0) container.textContent = 'Репозиториев не найдено.';
  }catch(e){
    container.textContent = 'Не удалось загрузить репозитории.';
  }
})();
</script>
</body>
</html>
