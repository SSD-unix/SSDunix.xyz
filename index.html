.container {

}
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.3s; }
.delay-3 { animation-delay: 0.5s; }

@keyframes fadeInUp {

  to { opacity: 1; transform: translateY(0); }

header {

header nav { font-size: 16px; margin: 8px 0; color: #94a3b8; }
header nav a { 
  color: #38bdf8; 
  text-decoration: none; 
  font-weight: 500;
  transition: 0.3s; 
}
header nav a:hover { color: #bae6fd; text-shadow: 0 0 10px rgba(56, 189, 248, 0.8); }

/* Обновленный блок для языков (с прокруткой) */
.lang-selector { 
  margin-top: 25px; 
  display: flex; 
  gap: 8px; 
  flex-wrap: wrap; 
  justify-content: center; 
  max-width: 800px;
  max-height: 130px; 
  overflow-y: auto; 
  padding: 15px;
  border-radius: 16px;
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.05);

}

.lang-selector::-webkit-scrollbar { width: 6px; }
.lang-selector::-webkit-scrollbar-track { background: transparent; }
.lang-selector::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 6px; }

.lang-selector button {

  border-radius: 10px;

  font-family: inherit;
  font-size: 13px; 
  font-weight: 500;

}

.lang-selector button:hover { 
  background: #38bdf8; 
  color: #0f172a;
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
  border-color: #38bdf8;
}

.card { 
  background: rgba(15, 23, 42, 0.5); 
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 35px; 
  border-radius: 20px; 
  margin-top: 25px; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
  transition: all 0.4s ease; 
}

.card:hover { 
  transform: translateY(-5px); 
  box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 20px rgba(56, 189, 248, 0.1); 
  border-color: rgba(56, 189, 248, 0.2);
}

h2 { 
  font-size: 28px; 
  margin-top: 0; 
  color: #f1f5f9; 
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

h2::before {
  content: "";
  display: block;
  width: 12px;
  height: 12px;
  background: #38bdf8;
  border-radius: 50%;
  box-shadow: 0 0 10px #38bdf8;
}

p {
  line-height: 1.7;
  color: #cbd5e1;
  font-size: 16px;
}

a { color: #38bdf8; transition: 0.3s; text-decoration: none;}
a:hover { color: #bae6fd; text-decoration: underline; }

.repo { 
  padding: 20px; 
  border-radius: 16px; 
  border-left: 4px solid #0ea5e9; 
  margin: 15px 0; 
  background: rgba(30, 41, 59, 0.4); 
  transition: all 0.3s ease;
  border-right: 1px solid transparent;

.repo:hover {

.repo strong a {

  color: #fff;

.repo div {

  line-height: 1.5;

.muted {

footer {

  color: #64748b; 
  text-align: center; 
  padding-bottom: 20px;

@media (max-width: 600px){
  .container { padding: 30px 15px; }
  header h1 { font-size: 42px; }
  h2 { font-size: 24px; }
  .card { padding: 25px; }
}

// Заполняем недостающие языки
Object.keys(langNames).forEach(k => {
  if(!texts[k]) {
    texts[k] = generateFallbackText(k);
  }
});

const btnContainer = document.getElementById('lang-buttons');
Object.keys(langNames).forEach(k => {
  const btn = document.createElement('button');
  btn.innerText = langNames[k];
  btn.onclick = () => setLanguage(k);
  btnContainer.appendChild(btn);
});

let rawUserLang = (navigator.language || navigator.userLanguage).split('-')[0];
let lang = texts[rawUserLang] ? rawUserLang : "ru";

function setLanguage(l){
  lang = l;
  // Поддержка письма справа налево (RTL) для Арабского, Иврита, Персидского и Урду
  if(['ar', 'he', 'fa', 'ur'].includes(l)) {
    document.body.style.direction = 'rtl';
  } else {
    document.body.style.direction = 'ltr';
  }
  
  document.getElementById("site-title").innerHTML = texts[lang]["site-title"];
  document.getElementById("about-title").innerHTML = texts[lang]["about-title"];
  document.getElementById("about-text").innerHTML = texts[lang]["about-text"];
  document.getElementById("news-text").innerHTML = texts[lang]["news-text"];
  document.getElementById("about-me-title").innerHTML = texts[lang]["about-me-title"];
  document.getElementById("about-me-text").innerHTML = texts[lang]["about-me-text"];
  document.getElementById("repos-title").innerHTML = texts[lang]["repos-title"];
  document.getElementById("footer-text").innerHTML = texts[lang]["footer-text"];
}

setLanguage(lang);

(async function(){
  const container = document.getElementById('repos');
  try{
    const res = await fetch('https://api.github.com/users/SSD-unix/repos');
    const repos = await res.json();
    container.innerHTML = '';
    repos.sort((a,b)=> new Date(b.updated_at)-new Date(a.updated_at));
    
    repos.forEach((r, index) => {
      const el = document.createElement('div'); 
      el.className = 'repo';
      el.style.animation = `fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) ${index * 0.15}s forwards`;
      
      const langText = r.language ? r.language : 'Shell';
      const dateText = new Date(r.updated_at).toLocaleDateString();
      
      el.innerHTML = `<strong><a href="${r.html_url}" target="_blank">${r.name}</a></strong>
                      <div class="muted">${langText} • ${dateText}</div>
                      <div>${r.description || ''}</div>`;
      container.appendChild(el);
    });
    
    if(repos.length === 0) container.textContent = 'Репозиториев не найдено.';
  }catch(e){
    container.textContent = 'Не удалось загрузить репозитории.';
  }
})();
</script>
