<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Крестики-нолики</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1e293b, #0f172a); color: #fff; }
  #root { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto; }
  .header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: #94a3b8; }
  .score { display: flex; gap: 24px; margin-bottom: 20px;
    background: rgba(255,255,255,0.05); padding: 12px 24px; border-radius: 14px; }
  .score .item { text-align: center; }
  .score .who { font-size: 11px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; }
  .score .val { font-size: 24px; font-weight: 700; }
  .score .item.me .val { color: #22d3ee; }
  .score .item.opp .val { color: #f472b6; }
  .board { display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; width: min(90vw, 340px); aspect-ratio: 1;
    background: rgba(255,255,255,0.03); padding: 8px; border-radius: 20px;
    margin-bottom: 20px; }
  .cell { background: rgba(255,255,255,0.06); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: 700; cursor: pointer;
    transition: background 0.15s, transform 0.1s; user-select: none; }
  .cell:active:not(.taken):not(.disabled) { transform: scale(0.95); }
  .cell.taken { cursor: default; }
  .cell.X { color: #22d3ee; }
  .cell.O { color: #f472b6; }
  .cell.disabled { cursor: not-allowed; opacity: 0.9; }
  .cell.win { background: rgba(34,211,238,0.25); animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { background: rgba(34,211,238,0.25); } 50% { background: rgba(34,211,238,0.45); } }
  .status { font-size: 16px; font-weight: 600; text-align: center;
    padding: 12px 20px; border-radius: 12px;
    background: rgba(255,255,255,0.05); margin-bottom: 16px; min-width: 200px; }
  .status.your-turn { background: rgba(34,211,238,0.2); color: #67e8f9; }
  .status.waiting { background: rgba(148,163,184,0.15); color: #94a3b8; }
  .status.win { background: rgba(34,197,94,0.25); color: #4ade80; }
  .status.lose { background: rgba(239,68,68,0.25); color: #f87171; }
  .status.draw { background: rgba(251,191,36,0.25); color: #fbbf24; }
  .btn { padding: 14px 28px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    background: #22d3ee; color: #0f172a; margin: 4px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn.secondary { background: rgba(255,255,255,0.1); color: #fff; }
  .btn.full { width: 100%; margin: 6px 0; padding: 16px; font-size: 16px; }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .lobby { text-align: center; max-width: 420px; width: 100%; }
  #qrBox { margin: 20px auto; display: flex; justify-content: center;
    align-items: center; background: #fff; padding: 12px; border-radius: 14px;
    width: fit-content; min-width: 220px; min-height: 220px; }
  #qrBox canvas, #qrBox img { display: block; }
  #qrBox .placeholder { color: #333; font-size: 13px; padding: 30px 20px;
    text-align: center; word-break: break-all; }
  .code { font-family: ui-monospace, monospace; background: rgba(255,255,255,0.08);
    padding: 10px 14px; border-radius: 8px; font-size: 15px;
    word-break: break-all; margin: 12px 0; user-select: all; color: #67e8f9;
    font-weight: 700; letter-spacing: 0.5px; }
  .code.hidden { display: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #22d3ee; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 20px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; display: none; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .overlay .box { background: linear-gradient(160deg, #1e293b, #0f172a);
    padding: 30px; border-radius: 20px; text-align: center;
    max-width: 340px; width: 90%; }
  .overlay .box h2 { font-size: 22px; margin: 0 0 10px; }
  .overlay .box p { color: #94a3b8; margin: 0 0 20px; font-size: 14px; }
  .err { color: #f87171; font-size: 12px; margin-top: 12px; word-break: break-word; }
  .info { color: #64748b; font-size: 11px; margin-top: 14px; line-height: 1.5; }

  /* Диалог ввода кода */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 300; display: none; align-items: center; justify-content: center;
    padding: 20px; }
  .modal.show { display: flex; }
  .modal .box { background: linear-gradient(160deg, #1e293b, #0f172a);
    padding: 24px; border-radius: 20px; max-width: 400px; width: 100%; }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { color: #94a3b8; font-size: 13px; margin: 0 0 16px; }
  .modal input { width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 16px;
    font-family: ui-monospace, monospace; outline: none; margin-bottom: 12px;
    text-align: center; letter-spacing: 1px; }
  .modal input:focus { background: rgba(255,255,255,0.12); }
  .modal .btns { display: flex; gap: 8px; }
  .modal .btns .btn { flex: 1; }
</style>
</head>
<body>
<div id="root">
  <div class="lobby">
    <div class="header">
      <h1>❌⭕ Крестики-нолики</h1>
      <div class="subtitle">Загрузка…</div>
    </div>
    <div class="spinner"></div>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="box">
    <h2 id="resultTitle">Победа!</h2>
    <p id="resultSub"></p>
    <div class="btns">
      <button class="btn" onclick="doRematch()">🔄 Ещё раз</button>
      <button class="btn secondary" onclick="safeClose()">✕ Выйти</button>
    </div>
  </div>
</div>

<div class="modal" id="codeModal">
  <div class="box">
    <h3>🔑 Введи код игры</h3>
    <p>Спроси у соперника код под его QR-кодом. Например: <b>game-a3f9c</b> или просто <b>a3f9c</b></p>
    <input id="codeInput" placeholder="game-xxxxx" autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="btns">
      <button class="btn secondary" onclick="closeCodeModal()">Отмена</button>
      <button class="btn" onclick="submitCode()">OK</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
'use strict';

// ================================================================
//  ENV
// ================================================================
const IN_IFRAME = (window !== window.parent);

// ================================================================
//  SDK
// ================================================================
const QRChat = {
  _id: 0, _pending: {}, _timeout: 15000,
  call(m, p) {
    if (!IN_IFRAME) return Promise.reject(new Error('not in iframe'));
    return new Promise((res, rej) => {
      const id = ++this._id;
      const timer = setTimeout(() => {
        delete this._pending[id];
        rej(new Error('timeout: ' + m));
      }, this._timeout);
      this._pending[id] = {
        res: v => { clearTimeout(timer); res(v); },
        rej: e => { clearTimeout(timer); rej(e); }
      };
      try {
        parent.postMessage({ __qrc: 1, id, method: m, params: p || {} }, '*');
      } catch (e) {
        clearTimeout(timer);
        delete this._pending[id];
        rej(e);
      }
    });
  },
  getUser:      () => QRChat.call('getUser'),
  scanQR:       () => QRChat.call('scanQR'),
  showToast:    (t) => QRChat.call('showToast', { text: t }).catch(() => {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9999;max-width:80%;text-align:center';
    el.textContent = t;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }),
  setTitle:     (t) => QRChat.call('setTitle', { text: t }).catch(() => { document.title = t; }),
  haptic:       (ms) => {
    if (navigator.vibrate) try { navigator.vibrate(ms || 15); } catch {}
    return QRChat.call('haptic', { pattern: ms || 15 }).catch(() => {});
  },
  close:        () => QRChat.call('close').catch(() => { try { window.close(); } catch {} }),
  setClipboard: (t) => QRChat.call('setClipboard', { text: t }).catch(() => {
    try { navigator.clipboard.writeText(t); QRChat.showToast('Скопировано'); } catch {}
  }),
  share:        (o) => QRChat.call('share', o).catch(() => {
    if (navigator.share) navigator.share(o).catch(() => {});
  })
};
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || !d.__qrc) return;
  const p = QRChat._pending[d.id];
  if (!p) return;
  delete QRChat._pending[d.id];
  d.error ? p.rej(new Error(d.error)) : p.res(d.result);
});

// ================================================================
//  STATE
// ================================================================
const NTFY = 'https://ntfy.sh';
let me = null;
let gameId = null;
let mySymbol = null;
let myRole = null;
let board = Array(9).fill('');
let turn = 'X';
let gameOver = false;
let winner = null;
let winLine = null;
let scores = { me: 0, opp: 0 };
let es = null;
let gameStarted = false;
let lastHelloSent = 0;

function rhex(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
}
function topicFor(id) { return 'game-' + id; }
function $(id) { return document.getElementById(id); }

// ================================================================
//  IDENTITY
// ================================================================
async function resolveIdentity() {
  if (IN_IFRAME) {
    try {
      const u = await QRChat.getUser();
      if (u && u.sid) return { sid: u.sid, nick: u.nick || 'Player', source: 'chat' };
    } catch (e) { console.warn('[TTT] getUser fail:', e.message); }
  }
  let local = null;
  try {
    const saved = localStorage.getItem('ttt_local_id');
    if (saved) local = JSON.parse(saved);
  } catch {}
  if (!local || !local.sid) {
    local = { sid: 'ttt-' + rhex(6), nick: 'Player-' + rhex(2).toUpperCase() };
    try { localStorage.setItem('ttt_local_id', JSON.stringify(local)); } catch {}
  }
  return { sid: local.sid, nick: local.nick, source: 'local' };
}

// ================================================================
//  LOBBY
// ================================================================
function renderLobby() {
  const mode = IN_IFRAME ? 'чат' : 'standalone';
  const src = me.source === 'chat' ? '🟢 чат' : '🟡 локальный';
  $('root').innerHTML = `
    <div class="lobby">
      <div class="header">
        <h1>❌⭕ Крестики-нолики</h1>
        <div class="subtitle">Играй с другом по коду или QR</div>
      </div>

      <button class="btn full" onclick="createGame()">
        🎮 Создать игру
      </button>

      <button class="btn secondary full" onclick="joinByQR()">
        📷 Присоединиться — сканировать QR
      </button>

      <button class="btn secondary full" onclick="openCodeModal()">
        ⌨ Ввести код вручную
      </button>

      <div class="info">
        Ты: <b>${me.nick}</b> · sid ${me.sid.slice(0,8)}<br>
        Режим: ${mode} · ID: ${src}
      </div>
      <div class="err" id="lobbyErr"></div>
    </div>
  `;
}

// ================================================================
//  CREATE
// ================================================================
function createGame() {
  try {
    gameId = rhex(5);
    myRole = 'host';
    mySymbol = 'X';
    gameStarted = false;
    board = Array(9).fill('');
    turn = 'X';
    gameOver = false;
    winner = null;
    winLine = null;
    showInviteQR();
  } catch (e) {
    $('lobbyErr').textContent = 'Ошибка: ' + e.message;
  }
}

// ================================================================
//  JOIN — через сканер основного сайта
// ================================================================
async function joinByQR() {
  try {
    if (!IN_IFRAME) {
      QRChat.showToast('Сканер только в чате. Используй «Ввести код».');
      openCodeModal();
      return;
    }
    QRChat.showToast('Открываю сканер…');
    const res = await QRChat.scanQR();
    if (!res || !res.value) {
      QRChat.showToast('Сканирование отменено');
      return;
    }
    handleScannedCode(res.value.trim());
  } catch (e) {
    QRChat.showToast('Ошибка сканера: ' + e.message);
    // Открываем ручной ввод как fallback
    openCodeModal();
  }
}

// ================================================================
//  JOIN — через ручной ввод
// ================================================================
function openCodeModal() {
  $('codeModal').classList.add('show');
  setTimeout(() => {
    const el = $('codeInput');
    el.value = '';
    el.focus();
  }, 100);
}
function closeCodeModal() {
  $('codeModal').classList.remove('show');
}
function submitCode() {
  const v = $('codeInput').value.trim();
  if (!v) { QRChat.showToast('Введи код'); return; }
  closeCodeModal();
  handleScannedCode(v);
}

// ================================================================
//  ОБРАБОТКА КОДА
// ================================================================
function handleScannedCode(v) {
  v = String(v).trim();
  if (!v) return;
  let id = null;
  if (v.startsWith('game-')) id = v.slice(5);
  else if (v.startsWith('nfc-')) id = v.slice(4);
  else id = v;
  // Убираем пробелы и мусор
  id = id.replace(/[^a-zA-Z0-9]/g, '');
  if (!id) { QRChat.showToast('Пустой код'); return; }

  gameId = id;
  myRole = 'guest';
  mySymbol = 'O';
  gameStarted = false;
  board = Array(9).fill('');
  turn = 'X';
  gameOver = false;
  winner = null;
  winLine = null;
  connectToGame();
  startGame();
}

// ================================================================
//  INVITE QR (для хоста)
// ================================================================
function showInviteQR() {
  const topic = topicFor(gameId);
  $('root').innerHTML = `
    <div class="lobby">
      <div class="header">
        <h1>🎮 Игра создана</h1>
        <div class="subtitle">Покажи QR или скажи код сопернику</div>
      </div>
      <div id="qrBox"></div>
      <div class="code" id="codeDisplay">${topic}</div>
      <button class="btn secondary full" onclick="copyCode()">📋 Копировать код</button>
      <button class="btn secondary full" onclick="shareCode()">📤 Поделиться</button>
      <button class="btn secondary full" onclick="toggleCodeVisibility()">👁 Показать/скрыть код</button>
      <div style="margin-top:20px; color:#94a3b8; font-size:13px;">
        <div class="spinner"></div>
        Ждём соперника…
      </div>
      <div class="err" id="qrErr"></div>
    </div>
  `;
  const box = $('qrBox');
  if (typeof QRCode === 'undefined') {
    box.innerHTML = `<div class="placeholder">QR-библиотека не загрузилась.<br><br>
      Скажи сопернику код:<br><b>${topic}</b></div>`;
  } else {
    try {
      box.innerHTML = '';
      new QRCode(box, {
        text: topic, width: 220, height: 220,
        colorDark: '#000', colorLight: '#fff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      box.innerHTML = `<div class="placeholder">Ошибка QR.<br>Код: <b>${topic}</b></div>`;
    }
  }
  connectToGame();
}
function toggleCodeVisibility() {
  const el = $('codeDisplay');
  if (el) el.classList.toggle('hidden');
}
async function copyCode() {
  await QRChat.setClipboard(topicFor(gameId));
  QRChat.showToast('Скопировано');
}
async function shareCode() {
  await QRChat.share({
    title: 'Крестики-нолики',
    text: 'Играй со мной: ' + topicFor(gameId)
  });
}

// ================================================================
//  NETWORK
// ================================================================
function connectToGame() {
  if (es) { try { es.close(); } catch {} es = null; }
  const topic = topicFor(gameId);
  const url = `${NTFY}/${encodeURIComponent(topic)}/sse?since=all`;
  try { es = new EventSource(url); } catch (e) { return; }
  es.onopen = () => sendHello();
  es.onerror = () => {};
  es.onmessage = (ev) => {
    let d;
    try { d = JSON.parse(ev.data); } catch { return; }
    if (d.event !== 'message') return;
    let msg;
    try { msg = JSON.parse(d.message || '{}'); } catch { return; }
    handleGameEvent(msg);
  };
}
async function sendHello() {
  const now = Date.now();
  if (now - lastHelloSent < 3000) return;
  lastHelloSent = now;
  await post({ type: 'hello', role: myRole, nick: me.nick, from: me.sid });
}
async function post(obj) {
  const topic = topicFor(gameId);
  try {
    await fetch(`${NTFY}/${encodeURIComponent(topic)}`, {
      method: 'POST',
      body: JSON.stringify(obj)
    });
  } catch (e) {}
}

// ================================================================
//  EVENTS
// ================================================================
function handleGameEvent(msg) {
  if (!msg || !msg.type) return;
  if (me && msg.from === me.sid) return;

  if (msg.type === 'hello') {
    if (!gameStarted) {
      gameStarted = true;
      QRChat.haptic([50, 50, 50]);
      QRChat.showToast('Соперник присоединился!');
      renderBoard();
    }
    return;
  }
  if (msg.type === 'move') {
    if (board[msg.cell] === '' && turn === msg.symbol) {
      board[msg.cell] = msg.symbol;
      checkWin();
      turn = turn === 'X' ? 'O' : 'X';
      QRChat.haptic(20);
      renderBoard();
    }
    return;
  }
  if (msg.type === 'rematch') {
    resetBoard();
    turn = 'X';
    winner = null; winLine = null; gameOver = false;
    QRChat.showToast('Соперник начал новую игру');
    renderBoard();
    return;
  }
}

// ================================================================
//  LOGIC
// ================================================================
async function cellClick(i) {
  if (gameOver) return;
  if (!gameStarted) { QRChat.showToast('Ждём соперника'); return; }
  if (turn !== mySymbol) { QRChat.showToast('Не твой ход'); return; }
  if (board[i] !== '') return;
  board[i] = mySymbol;
  checkWin();
  turn = turn === 'X' ? 'O' : 'X';
  QRChat.haptic(20);
  renderBoard();
  await post({ type: 'move', cell: i, symbol: mySymbol, from: me.sid });
}
function checkWin() {
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  for (const l of lines) {
    if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[0]] === board[l[2]]) {
      gameOver = true; winner = board[l[0]]; winLine = l;
      if (winner === mySymbol) { scores.me++; showResult('win'); }
      else { scores.opp++; showResult('lose'); }
      return;
    }
  }
  if (board.every(c => c)) {
    gameOver = true; winner = 'draw'; showResult('draw');
  }
}
function showResult(kind) {
  QRChat.haptic(kind === 'win' ? [100,50,100,50,100] : 200);
  setTimeout(() => {
    const ov = $('resultOverlay'), t = $('resultTitle'), s = $('resultSub');
    if (kind === 'win') { t.textContent = '🎉 Победа!'; s.textContent = 'Ты обыграл соперника'; }
    else if (kind === 'lose') { t.textContent = '😔 Проигрыш'; s.textContent = 'Соперник оказался сильнее'; }
    else { t.textContent = '🤝 Ничья'; s.textContent = 'Отличная игра!'; }
    ov.classList.add('show');
  }, 400);
}

// ================================================================
//  RENDER BOARD
// ================================================================
function renderBoard() {
  $('root').innerHTML = `
    <div class="header">
      <h1>❌⭕ Крестики-нолики</h1>
      <div class="subtitle">Ты играешь за <b>${mySymbol}</b></div>
    </div>
    <div class="score">
      <div class="item me"><div class="who">Ты</div><div class="val">${scores.me}</div></div>
      <div class="item opp"><div class="who">Соперник</div><div class="val">${scores.opp}</div></div>
    </div>
    <div class="board" id="board"></div>
    <div class="status" id="status">…</div>
    <div class="btns">
      <button class="btn secondary" onclick="leaveGame()">🚪 Выйти</button>
    </div>
  `;
  const boardEl = $('board');
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (board[i]) {
      cell.textContent = board[i];
      cell.classList.add('taken', board[i]);
    }
    if (winLine && winLine.includes(i)) cell.classList.add('win');
    if (gameOver || turn !== mySymbol || !gameStarted) cell.classList.add('disabled');
    cell.addEventListener('click', () => cellClick(i));
    boardEl.appendChild(cell);
  }
  const st = $('status');
  if (gameOver) {
    if (winner === mySymbol) { st.textContent = '🎉 Ты победил!'; st.className = 'status win'; }
    else if (winner === 'draw') { st.textContent = '🤝 Ничья'; st.className = 'status draw'; }
    else { st.textContent = '😔 Ты проиграл'; st.className = 'status lose'; }
  } else if (!gameStarted) {
    st.textContent = '⏳ Ждём соперника…'; st.className = 'status waiting';
  } else if (turn === mySymbol) {
    st.textContent = '👆 Твой ход'; st.className = 'status your-turn';
  } else {
    st.textContent = '⏳ Ход соперника'; st.className = 'status waiting';
  }
}
async function doRematch() {
  $('resultOverlay').classList.remove('show');
  resetBoard();
  turn = 'X';
  winner = null; winLine = null; gameOver = false;
  renderBoard();
  await post({ type: 'rematch', from: me.sid });
}
function resetBoard() { board = Array(9).fill(''); }
async function leaveGame() {
  if (es) { try { es.close(); } catch {} es = null; }
  await post({ type: 'leave', from: me.sid });
  QRChat.close();
}
async function safeClose() {
  try { await QRChat.close(); } catch { try { window.close(); } catch {} }
}
function startGame() {
  gameStarted = false;
  renderBoard();
  QRChat.setTitle('❌⭕ Игра');
}

// ================================================================
//  BOOT
// ================================================================
(async function boot() {
  try {
    me = await resolveIdentity();
    renderLobby();
    QRChat.setTitle('❌⭕ Крестики-нолики');
  } catch (e) {
    $('root').innerHTML = `
      <div class="lobby">
        <div class="header">
          <h1>⚠️ Ошибка</h1>
          <div class="subtitle" style="color:#f87171;">${e.message}</div>
        </div>
        <button class="btn secondary" onclick="location.reload()">↻ Ещё раз</button>
      </div>
    `;
  }
})();

// Enter в поле ввода = submit
document.addEventListener('DOMContentLoaded', () => {
  const el = $('codeInput');
  if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
});

Object.assign(window, {
  createGame, joinByQR, openCodeModal, closeCodeModal, submitCode,
  copyCode, shareCode, cellClick, doRematch, leaveGame, safeClose,
  toggleCodeVisibility
});
</script>
